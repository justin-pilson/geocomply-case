<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales | Demo CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div class="sfw">
<div class="sf">
<header class="gh">
<div class="org"><svg role="img" aria-label="GeoComply" viewBox="0 0 228 38"><g transform="scale(1.1176)"><path d="M13.8.6c6 0 10.2 3.2 11.5 8.6l-3.2 1.4c-1-4.5-3.8-6.8-8.3-6.8-5.8 0-9.6 4-9.6 10 0 5.7 3.6 9.8 8.6 9.8 4.3 0 7.8-3 8.5-7.1h-9.1v-3.3h13.3v13.2h-3V21c-2.1 3.9-5.1 5.7-9.4 5.7-7.4 0-12.6-5.4-12.6-13C.5 6 6 .6 13.8.6zm14.6 17.1c0-5.2 3.7-8.9 8.8-8.9 5 0 8.5 3.5 8.5 8.5v1H31.8c.2 3.3 2.4 5.5 5.4 5.5 2.4 0 4.2-1.3 5.1-3.7l3.3.9c-1.3 3.5-4.5 5.8-8.4 5.8-5.1-.2-8.8-4-8.8-9.1zm13.8-1.9c-.4-2.4-2.3-4-5-4-2.6 0-4.5 1.6-5.1 4h10.1zm6.1 1.9c0-5.2 3.7-8.9 8.8-8.9 5.1 0 8.8 3.8 8.8 8.9 0 5.2-3.7 9-8.8 9-5.1-.1-8.8-3.8-8.8-9zm3.3 0c0 3.5 2.3 6 5.5 6s5.3-2.5 5.3-6-2.1-5.9-5.3-5.9c-3.2-.1-5.5 2.4-5.5 5.9zm40.8.5c-1.4 5.3-5.6 8.5-11.2 8.5-7.5 0-13-5.6-13-13.1S73.7.6 81.1.6c5.8 0 10 3.3 11.3 8.6l-3.2 1.4c-.8-4.3-3.8-6.8-8-6.8-5.3 0-9.2 4.2-9.2 9.9s3.9 9.9 9.2 9.9c4.1 0 7.2-2.6 8-6.8l3.2 1.4zm2.3-.5c0-5.2 3.7-8.9 8.8-8.9 5.1 0 8.8 3.8 8.8 8.9 0 5.2-3.7 9-8.8 9-5.1-.1-8.8-3.8-8.8-9zm3.4 0c0 3.5 2.3 6 5.5 6s5.3-2.5 5.3-6-2.1-5.9-5.3-5.9c-3.2-.1-5.5 2.4-5.5 5.9zm36.3 8.6V15.1c0-2.1-1.2-3.3-3-3.3-2 0-3.3 1.5-3.3 3.9v10.6h-3.3V15.1c0-2.1-1.2-3.4-3-3.4-2 0-3.3 1.5-3.3 4v10.5h-3.3V9h3.2v2.2c.9-1.7 2.6-2.5 4.5-2.5 2.2 0 3.8 1.1 4.4 3.2 1-2 2.8-3.2 5.2-3.2 3.2 0 5.1 2 5.1 5.6v11.9h-3.2zm6.9 7.1V9h3.2v2.8c1.2-1.9 3.6-3.1 6.2-3.1 4.4 0 7.7 3.6 7.7 8.9 0 5.3-3.3 9-8 9-2.4 0-4.6-1-5.8-2.8v9.5l-3.3.1zm3.1-15.7c0 3.8 2.7 5.9 5.5 5.9 2.5 0 5.2-1.8 5.2-5.7 0-3.2-1.9-6.2-5.1-6.2-2.9 0-5.6 2.3-5.6 6zm16.8 8.6V.9h3.3v25.4h-3.3zm7.7 7.1 4.2-9.1L166.5 9h3.7l4.8 11.1L180.1 9h3.6l-11.1 24.4h-3.7z" fill="#0A003C"></path><path d="M202.5.9v8c0 5.2-2.9 9.4-8.4 11.4-5.5-2-8.4-6.2-8.4-11.4v-8h16.8zm-15.1 1.6v6.4c0 4.4 2.2 7.8 6.8 9.7 4.5-1.9 6.8-5.3 6.8-9.7V2.5h-13.6zm3.7 3.6v2.8c0 2.5.8 4.3 3 5.6 1.9-1.1 2.9-2.6 3-4.7h-4V8.1h5.8v.8c0 3.3-1.6 5.9-4.8 7.5-3.1-1.6-4.7-4.2-4.7-7.5V4.5h9.5v1.7h-7.8z" fill="#003FF2"></path></g></svg></div>
<div class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Search...</span></div>
<div class="gicons">
<span class="gi grp"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"></path></svg><span class="sep"></span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="gi box"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="gi"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="gi"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.3 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="gi bellw"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 19a2 2 0 0 0 4 0" fill="currentColor"></path></svg></span>
<span class="me">LO</span>
</div>
</header>
<nav class="ctx" aria-label="Sales navigation">
<span class="waffle" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
<span class="app">Sales</span>
<span class="tab">Home</span>
<button class="tab on" onClick="{{s.toList}}">Opportunities <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<span class="tab">Leads <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="tab">Tasks <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="tab">Files <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="tab">Accounts <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="tab">Contacts <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="tab">Campaigns <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="tab">Dashboards <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="tab">Reports <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="tab">More <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span class="pencil" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
</nav>

<!-- ============ LIST VIEW ============ -->
<sc-if value="{{s.isList}}" hint-placeholder-val="{{ true }}">
<div class="page">
<section class="card lv">
<div class="lvh">
<div class="hlname"><span class="oicon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 18h18l1-11-6 4.5L12 4 8 11.5 2 7z" fill="currentColor"></path></svg></span><div><p class="otype">Opportunities</p><p class="lvt">Recently Viewed <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></p></div></div>
<div class="hlbtns"><button class="resetlink" onClick="{{s.reset}}">Reset demo</button><button class="nb" onClick="{{s.openNew}}">New</button><span class="nb">Import</span><span class="nb icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></div>
</div>
<p class="lvm">{{s.listCount}} items, sorted by Opportunity Name, updated a few seconds ago</p>
<div class="lt">
<div class="lth"><span></span><span>Opportunity Name</span><span>Account Profile</span><span>Stage</span><span>Opportunity Owner</span></div>
<sc-for list="{{s.listRows}}" as="lr" hint-placeholder-count="8">
<div class="{{lr.cls}}"><span class="ln">{{lr.n}}</span><span class="link">{{lr.name}}</span><span>{{lr.profile}}</span><span>{{lr.stage}}</span><span>{{lr.owner}}</span></div>
</sc-for>
</div>
</section>
</div>
</sc-if>

<!-- ============ NEW OPPORTUNITY MODAL ============ -->
<sc-if value="{{s.newOpen}}" hint-placeholder-val="{{ false }}">
<div class="mback">
<section class="modal" role="dialog" aria-modal="true" aria-label="New Opportunity">
<header class="mh"><h2>New Opportunity</h2><button class="mx" onClick="{{s.closeNew}}" aria-label="Cancel and close"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></header>
<div class="mb">
<p class="req"><span>*</span> = Required Information</p>
<p class="sech">Opportunity Information</p>
<div class="mgrid2">
<div class="fld"><label><span class="star">*</span>Opportunity Name</label><div class="inp">{{s.f.name}}</div></div>
<div class="fld"><label>Opportunity Owner</label><div class="inp ro"><span class="oav">LO</span>Lena Ortiz</div></div>
<div class="fld"><label><span class="star">*</span>Account Name</label><div class="inp"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{s.f.account}}</div></div>
<div class="fld"><label>Account Profile</label><div class="inp">{{s.f.profile}}</div></div>
<sc-for list="{{s.picks}}" as="pk" hint-placeholder-count="4">
<div class="fld"><label>{{pk.label}}</label>
<button class="inp pick" onClick="{{pk.toggle}}"><span class="{{pk.vcls}}">{{pk.value}}</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<sc-if value="{{pk.open}}" hint-placeholder-val="{{ false }}"><div class="menu"><sc-for list="{{pk.options}}" as="op" hint-placeholder-count="4"><button class="{{op.cls}}" onClick="{{op.pick}}">{{op.t}}</button></sc-for></div></sc-if>
</div>
</sc-for>
<div class="fld"><label><span class="star">*</span>Products Discussed</label>
<div class="checks"><sc-for list="{{s.prodChecks}}" as="pc" hint-placeholder-count="3"><button class="{{pc.cls}}" onClick="{{pc.toggle}}" role="checkbox" aria-checked="{{pc.on}}"><span class="cb"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>{{pc.t}}</button></sc-for></div>
</div>
<div class="fld"><label><span class="star">*</span>Stage</label><div class="inp ro">Discovery</div></div>
</div>
<div class="fld wide"><label>Problem (as described by prospect)</label><div class="inp area">{{s.f.problem}}</div></div>
</div>
<footer class="mf">
<button class="demo" onClick="{{s.fill}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"></path></svg> Fill demo deal</button>
<span class="mfb"><button class="nb" onClick="{{s.closeNew}}">Cancel</button><button class="nb">Save &amp; New</button><button class="{{s.saveCls}}" onClick="{{s.save}}">Save</button></span>
</footer>
</section>
</div>
</sc-if>

<!-- ============ RECORD PAGE ============ -->
<sc-if value="{{s.isRecord}}" hint-placeholder-val="{{ false }}">
<div class="page">
<section class="card hl">
<div class="hltop">
<div class="hlname"><span class="oicon" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 18h18l1-11-6 4.5L12 4 8 11.5 2 7z" fill="currentColor"></path></svg></span><div><p class="otype">Opportunity</p><h1 class="oname">{{s.f.name}}</h1></div></div>
<div class="hlbtns"><button class="nb">+ Follow</button><span class="bgroup"><button class="nb">Edit</button><button class="nb">New Note</button><button class="nb">Clone</button><button class="nb icon" aria-label="More actions"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></span></div>
</div>
<div class="hlfields">
<div><p class="fl">Account Name</p><p class="fv link">{{s.f.account}}</p></div>
<div><p class="fl">Est. ACV Band</p><p class="fv">{{s.f.acv}}</p></div>
<div><p class="fl">Days Open</p><p class="fv">{{s.days}}</p></div>
<div><p class="fl">Lead Source</p><p class="fv">{{s.f.source}}</p></div>
<div><p class="fl">Opportunity Owner</p><p class="fv owner"><span class="oav">LO</span><span class="link">Lena Ortiz</span></p></div>
</div>
</section>

<section class="card pathcard">
<div class="path">
<div class="steps">
<sc-for list="{{s.stepsV}}" as="sp" hint-placeholder-count="8"><button class="{{sp.cls}}" onClick="{{sp.go}}" title="{{sp.t}}"><sc-if value="{{sp.done}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if><sc-if value="{{sp.showT}}" hint-placeholder-val="{{ true }}">{{sp.t}}</sc-if></button></sc-for>
</div>
<button class="bb" onClick="{{s.markStage}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg> {{s.markLabel}}</button>
</div>
</section>

<div class="cols">
<div class="maincol">

<!-- ======= custom component: the platform inside Salesforce ======= -->
<section class="gc" aria-label="Deal guidance">
<div class="gchead">
<span class="gcbrand"><svg aria-hidden="true" viewBox="185 0 18.5 21"><path d="M202.5.9v8c0 5.2-2.9 9.4-8.4 11.4-5.5-2-8.4-6.2-8.4-11.4v-8h16.8zm-15.1 1.6v6.4c0 4.4 2.2 7.8 6.8 9.7 4.5-1.9 6.8-5.3 6.8-9.7V2.5h-13.6zm3.7 3.6v2.8c0 2.5.8 4.3 3 5.6 1.9-1.1 2.9-2.6 3-4.7h-4V8.1h5.8v.8c0 3.3-1.6 5.9-4.8 7.5-3.1-1.6-4.7-4.2-4.7-7.5V4.5h9.5v1.7h-7.8z" fill="#FFFFFF"></path></svg><span>Platform name</span><span class="gcsub">Deal guidance</span></span>
<span class="gclive"><i class="{{s.liveCls}}"></i>{{s.liveText}}</span><sc-if value="{{s.hasPlatform}}" hint-placeholder-val="{{ true }}"><a class="gcopen" href="{{s.platformUrl}}" target="_blank" rel="noopener">Open in platform <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a></sc-if>
</div>
<div class="gcbody">

<sc-if value="{{s.closed}}" hint-placeholder-val="{{ false }}">
<div class="gwon"><span class="gwd"></span><span>{{s.closedText}}</span></div>
</sc-if>

<sc-if value="{{s.calling}}" hint-placeholder-val="{{ false }}">
<div class="run"><div class="runtop"><span class="spin"></span><p class="runh">{{s.callText}}</p><p class="runc">Reading past deals from the database</p></div><div class="rbar"><span class="indet"></span></div></div>
</sc-if>
<sc-if value="{{s.running}}" hint-placeholder-val="{{ false }}">
<div class="run">
<div class="runtop"><span class="spin"></span><p class="runh">{{s.runTitle}}</p><p class="runc">{{s.runCount}}</p></div>
<div class="rbar"><span style="{{s.runBar}}"></span></div>
<div class="rlist">
<sc-for list="{{s.runRows}}" as="rr" hint-placeholder-count="6"><div class="rrow"><span class="rn">{{rr.name}}</span><span class="rg">{{rr.group}}</span><span class="rb"><i style="{{rr.bar}}"></i></span><span class="rp">{{rr.pct}}</span></div></sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}">
<div class="mline"><span>{{s.modelLine}}</span><button class="mtog" onClick="{{s.toggleWhy}}">{{s.whyLabel}}</button></div>
<sc-if value="{{s.whyOpen}}" hint-placeholder-val="{{ false }}">
<div class="why">
<div class="wh"><span>Past deal</span><span>Industry</span><span>Match</span><span>What it got stuck on</span></div>
<sc-for list="{{s.whyRows}}" as="wr" hint-placeholder-count="6"><div class="{{wr.cls}}"><span class="wn">{{wr.name}}</span><span>{{wr.group}}</span><span class="wm"><i style="{{wr.bar}}"></i>{{wr.pct}}</span><span>{{wr.tags}}</span></div></sc-for>
<p class="wfoot">{{s.whyFoot}}</p>
</div>
</sc-if>
<sc-if value="{{s.showPreds}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{s.preds}}" as="pd" hint-placeholder-count="3">
<section class="{{pd.cls}}" aria-label="{{pd.label}}, {{pd.st}}">
<div class="gtop"><h2 class="gname">{{pd.label}}</h2><span class="gst"><i aria-hidden="true"></i>{{pd.st}}</span></div>
<p class="gev">{{pd.evidence}}</p>
<div class="gsplit">
<div class="gcol"><p class="gl">{{pd.wLabel}}</p><p class="gtxt"><b>{{pd.wFrom}}</b> {{pd.wText}}</p></div>
<div class="gcol"><p class="gl">Do this next</p>
<sc-if value="{{pd.hasBtn}}" hint-placeholder-val="{{ true }}"><button class="{{pd.btnCls}}" onClick="{{pd.btnGo}}">{{pd.btnLabel}}</button></sc-if>
<sc-if value="{{pd.hasState}}" hint-placeholder-val="{{ false }}"><span class="gdone"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg> {{pd.stateText}}</span></sc-if>
<p class="gtxt">{{pd.next}}</p>
<sc-if value="{{pd.hasMsg}}" hint-placeholder-val="{{ true }}"><button class="glink" onClick="{{pd.msgGo}}">{{pd.msgLabel}}</button></sc-if>
</div>
</div>
</section>
</sc-for>
</sc-if>
</sc-if>

<sc-if value="{{s.idle}}" hint-placeholder-val="{{ false }}"><p class="gidle">Save the deal to see what it might get stuck on.</p></sc-if>
</div>
</section>

<section class="card tabs">
<div class="tabbar" role="tablist">
<sc-for list="{{s.tabs}}" as="t" hint-placeholder-count="3"><button class="{{t.cls}}" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
</div>
<sc-if value="{{s.isActivity}}" hint-placeholder-val="{{ true }}">
<div class="sec">
<div class="actbar"><span class="nb">New Task</span><button class="nb" onClick="{{s.openNote}}">Log a Call</button><span class="nb">New Event</span><span class="nb">Email</span></div>
<p class="sech"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg> Upcoming &amp; Overdue</p>
<p class="none">No activities to show. Get started by sending an email, scheduling a task, and more.</p>
<p class="sech"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg> Past activity</p>
<sc-if value="{{s.noteLogged}}" hint-placeholder-val="{{ false }}"><div class="act"><span class="aicon call"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" fill="currentColor"></path></svg></span><div><p class="atitle link">Call: technical scoping with their head of trust</p><p class="adesc">{{s.noteBody}}</p></div><span class="adate">3 weeks after opening</span></div></sc-if>
<sc-if value="{{s.noNote}}" hint-placeholder-val="{{ true }}"><p class="none">No past activity. Past meetings and tasks marked as done show up here.</p></sc-if>
</div>
</sc-if>
<sc-if value="{{s.isDetails}}" hint-placeholder-val="{{ false }}">
<div class="sec">
<p class="sech"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg> Opportunity Information</p>
<div class="fgrid"><sc-for list="{{s.fields}}" as="fd" hint-placeholder-count="10"><div class="frow"><p class="fl">{{fd.k}}</p><p class="fv">{{fd.v}}<span class="pen" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></p></div></sc-for></div>
</div>
</sc-if>
<sc-if value="{{s.isChatter}}" hint-placeholder-val="{{ false }}">
<div class="sec"><div class="chat"><span>Share an update...</span><span class="bb small">Share</span></div><p class="none">No posts yet.</p></div>
</sc-if>
</section>
</div>

<aside class="side">
<section class="card rl">
<div class="rlh"><span class="ricon prod"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span class="rlt">Products ({{s.prodCount}})</span><span class="nb icon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></div>
<sc-for list="{{s.prodRows}}" as="pr" hint-placeholder-count="2"><div class="rli"><p class="link">{{pr.t}}</p></div></sc-for>
<p class="rlv">View All</p>
</section>
<section class="card rl">
<div class="rlh"><span class="ricon file"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span class="rlt">Files (0)</span><span class="nb">Add Files</span></div>
<div class="drop"><span class="nb"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg> Upload Files</span><span class="rk">Or drop files</span></div>
</section>
<p class="note">Mock-up of a CRM for the GeoComply case. Made up: the rep Lena Ortiz, the engineer Maya Chen and the order of the stages. The model runs on a server against the 17 other deals from the case’s pipeline extract, stored in the database. <button class="resetlink" onClick="{{s.reset}}">Reset demo</button></p>
</aside>
</div>
</div>
</sc-if>

<!-- ============ LOG A CALL ============ -->
<sc-if value="{{s.noteOpen}}" hint-placeholder-val="{{ false }}">
<div class="mback">
<section class="modal small" role="dialog" aria-modal="true" aria-label="Log a Call">
<header class="mh"><h2>Log a Call</h2><button class="mx" onClick="{{s.closeNote}}" aria-label="Cancel and close"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></header>
<div class="mb">
<div class="fld"><label>Subject</label><div class="inp">Call: technical scoping with their head of trust</div></div>
<div class="fld"><label>Related To</label><div class="inp ro"><span class="oicon" style="width: 16px; height: 16px; border-radius: 3px"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 18h18l1-11-6 4.5L12 4 8 11.5 2 7z" fill="currentColor"></path></svg></span> {{s.f.name}}</div></div>
<div class="fld wide"><label>Comments</label><div class="inp area">{{s.noteText}}</div></div>
<p class="jump"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg> Three weeks after the deal was opened</p>
</div>
<footer class="mf">
<button class="demo" onClick="{{s.fillNote}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"></path></svg> Fill demo note</button>
<span class="mfb"><button class="nb" onClick="{{s.closeNote}}">Cancel</button><button class="{{s.noteSaveCls}}" onClick="{{s.saveNote}}">Save</button></span>
</footer>
</section>
</div>
</sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div class="toast" role="status"><span class="tic"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span>{{toast}}</span></div>
</sc-if>
</div>

</div>
</template>
<script src="lib/morphdom.js"></script>
<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script src="lib/dc.js"></script>
<script src="app.js"></script>
<script>mount(Component);</script>
</body>
</html>
